name: Delivery
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-delivery
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      web: ${{ steps.image.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: APP_VERSION=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ steps.image.outputs.web }}
          build-args: NEXT_PUBLIC_API_URL=/api
  deploy:
    needs: image
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.DEPLOY_TARGET != 'vps'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy and verify pinned version
        env:
          IMAGE_URL: ${{ needs.image.outputs.image }}
          EXPECTED_VERSION: ${{ github.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: node scripts/deploy.mjs
      - name: Rollback instructions
        if: failure()
        run: echo 'Deployment failed. Follow docs/deployment.md to restore the previous verified image SHA and web deployment. Do not reset the database.'

  deploy-vps:
    needs: image
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy verified images over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_PATH: ${{ vars.VPS_PATH }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VPS_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/vps/compose.yml deploy/vps/Caddyfile deploy/vps/db-init.sql deploy/vps/deploy.sh "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH' && bash deploy.sh '$GITHUB_SHA'"

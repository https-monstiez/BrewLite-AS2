name: CI
on:
  pull_request:
  push:
    branches: [main, as2]
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: as2test
          POSTGRES_PASSWORD: as2_test_only
          POSTGRES_DB: brewlite_as2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U as2test -d brewlite_as2_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://as2test:as2_test_only@localhost:5432/brewlite_as2_test
      TEST_DATABASE_URL: postgresql://as2test:as2_test_only@localhost:5432/brewlite_as2_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3101/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install
        run: npm run install:apps
      - name: Generate Prisma Client
        run: npm run prisma:generate --prefix apps/api
      - name: Lint
        run: npm run lint
      - name: Unit and HTTP authorization tests
        run: npm test
      - name: Migrate isolated PostgreSQL
        run: npm run prisma:deploy --prefix apps/api
      - name: Real PostgreSQL integration tests
        run: npm run test:integration --prefix apps/api
      - name: Build
        run: npm run build
      - name: Seed browser test catalog
        run: npm run db:seed --prefix apps/api
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end checkout
        run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

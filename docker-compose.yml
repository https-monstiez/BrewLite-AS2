services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PAYMENT_MODE: ${PAYMENT_MODE:-simulation}
      BANK_BIN: ${BANK_BIN:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      PORT: 3001
    ports: ['${API_PORT:-3001}:3001']
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
